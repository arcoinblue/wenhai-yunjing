# Rime schema
# encoding: utf-8
#
# 西夏文 · Downes 部首（寬） — Tangut by Downes radical code, reduced radicals accepted
# Type a character's radical code (e.g. macanali or maca-nali for 𗀀). Hyphens are optional.
# Several characters can be typed in a row. Press ` to look a character up by its GHC reading.

schema:
  schema_id: tangut_downes_reduced
  name: "西夏 Downes 寬"
  version: "@VERSION@"
  author:
    - "Codes: Alan Downes, Xixia Dictionaries (2008)"
    - "Data: arcoinblue/wenhai-yunjing"
  description: |
    Tangut input by Alan Downes's Recursive Radical Method with reduced radicals: any radical of the same
    group is accepted in place of the one in the code.
    Readings: Gong Hwang-cherng. ` + GHC spelling looks a character up by sound.
  dependencies:
    - tangut_ghc
    - tangut_downes

switches:
  - name: ascii_mode
    reset: 0
    states: [ 西夏, ABC ]
  - options: [ gloss_en, gloss_zh, gloss_none ]
    reset: 0
    states: [ "EN", "中", "—" ]
  - name: full_shape
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - script_translator
    - lua_translator@*tangut_complete@tangut_complete
  filters:
    - uniquifier
    - lua_filter@*tangut_gloss@tangut_gloss

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz-"
  initials: "abcdefghijklmnopqrstuvwxyz"
  delimiter: " '-"
  algebra:
    # Each radical may be typed as any member of its reduced group
    # (groups: tangut_v2.reduced, as on the Wenhai practice page).
    # @REDUCED_ALGEBRA@

translator:
  dictionary: tangut_downes
  prism: tangut_downes_reduced
  enable_user_dict: true
  preedit_format:
    - "xform/ //"

reverse_lookup:
  dictionary: tangut_ghc
  prism: tangut_ghc
  prefix: "`"
  suffix: "'"
  tips: "〔GHC〕"
  preedit_format:
    - "xform/([aeiouyh][fc]*)n/$1N/"
    - "xform/sx/ś/"
    - "xform/zx/ź/"
    - "xform/nx/ń/"
    - "xform/ng/ŋ/"
    - "xform/gh/ɣ/"
    - "xform/eh/ə/"
    - "xform/y/ɨ/"
    - "xform/q/ꞏ/"
    - "xform/f/̱/"
    - "xform/c/̣/"
    - "xform/N/̃/"
    - "xform [;1] ¹"
    - "xform [/2] ²"

tangut_gloss:
  show_ghc: true
  show_code: false
  show_code_reverse: true   # Downes code on ` (GHC) lookups
  exact_first: true

# characters whose code continues what has been typed
tangut_complete:
  reduced: true
  limit: 300

punctuator:
  import_preset: default

key_binder:
  bindings:
    - { when: paging, accept: comma, send: Page_Up }
    - { when: has_menu, accept: period, send: Page_Down }
    - { when: paging, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
    - { when: has_menu, accept: Tab, send: Down }
    - { when: has_menu, accept: Shift+Tab, send: Up }
    - { when: always, accept: Control+period, toggle: ascii_punct }

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z;/']*$"

menu:
  page_size: 9

# Candidate window font (Squirrel and Weasel read this per schema).
style:
  font_face: "Noto Serif Tangut, BabelStone Tangut Wenhai, Tangut Yinchuan, PingFang SC, Microsoft YaHei"
  font_point: 18
  comment_font_face: "Helvetica Neue, Segoe UI, PingFang SC, Microsoft YaHei"
  comment_font_point: 12
