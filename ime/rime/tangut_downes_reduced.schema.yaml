# Rime schema
# encoding: utf-8
#
# 西夏文 · Downes 部首（寬） — Tangut by Downes radical code, reduced radicals accepted
# Type a character's radical code (e.g. macanali or maca-nali for 𗀀). Hyphens are optional.
# Several characters can be typed in a row. Press ` to look a character up by its GHC reading.

schema:
  schema_id: tangut_downes_reduced
  name: "西夏 Downes 寬"
  version: "1.0"
  author:
    - "Codes: Alan Downes, Xixia Dictionaries (2008)"
    - "Data: arcoinblue/wenhai-yunjing"
  description: |
    Tangut input by Alan Downes's Recursive Radical Method with reduced radicals: any radical of the same
    group is accepted in place of the one in the code.
    Readings: Gong Hwang-cherng. ` + GHC spelling looks a character up by sound.
  dependencies:
    - tangut_ghc
    - tangut_downes

switches:
  - name: ascii_mode
    reset: 0
    states: [ 西夏, ABC ]
  - options: [ gloss_en, gloss_zh, gloss_none ]
    reset: 0
    states: [ "EN", "中", "—" ]
  - name: full_shape
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - script_translator
    - lua_translator@*tangut_complete@tangut_complete
  filters:
    - uniquifier
    - lua_filter@*tangut_gloss@tangut_gloss

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz-"
  initials: "abcdefghijklmnopqrstuvwxyz"
  delimiter: " '-"
  algebra:
    # Each radical may be typed as any member of its reduced group
    # (groups: tangut_v2.reduced, as on the Wenhai practice page).
